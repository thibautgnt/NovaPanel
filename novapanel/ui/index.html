<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NovaPanel</title>
<link rel="stylesheet" href="style.css">
<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
</head>
<body>
<header id="titlebar">
  <div class="brand"><img src="../assets/icon.png" alt="">NovaPanel<span class="sub">Arctis Nova Pro Wireless</span></div>
  <div id="conn" class="chip"><span class="dot"></span><span class="label" data-i18n="connecting"></span></div>
  <div class="winbtns">
    <button id="btn-about" data-i18n-title="about"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.01"/></svg><i class="dot" hidden></i></button>
    <button id="btn-min" data-i18n-title="min"><svg viewBox="0 0 12 12"><path d="M2 6h8"/></svg></button>
    <button id="btn-close" data-i18n-title="close"><svg viewBox="0 0 12 12"><path d="M3 3l6 6M9 3l-6 6"/></svg></button>
  </div>
</header>

<main>
  <section id="stage">
    <div class="tiles">
      <div class="tile" id="t-headset">
        <div class="tile-head"><svg viewBox="0 0 24 24"><path d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect x="3" y="14" width="4" height="6" rx="1.5"/><rect x="17" y="14" width="4" height="6" rx="1.5"/></svg><span data-i18n="headset"></span><em class="badge"></em></div>
        <div class="tile-val"><span class="val">—</span><small>%</small></div>
        <div class="meter"><i></i></div>
      </div>
      <div class="tile" id="t-spare">
        <div class="tile-head"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="16" height="10" rx="2"/><path d="M21 10.5v3"/><path d="M7 10v4M10.5 10v4" /></svg><span data-i18n="spare"></span><em class="badge"></em></div>
        <div class="tile-val"><span class="val">—</span><small>%</small></div>
        <div class="meter"><i></i></div>
      </div>
      <div class="tile" id="t-vol">
        <div class="tile-head"><svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg><span>Volume</span><em class="badge"></em></div>
        <div class="tile-val"><span class="val">—</span><small>%</small></div>
        <div class="meter"><i></i></div>
      </div>
      <div class="tile" id="t-mic">
        <div class="tile-head"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg><span data-i18n="mic"></span><em class="badge"></em></div>
        <div class="tile-val"><span class="val">—</span></div>
        <div class="meter"><i></i></div>
      </div>
    </div>

    <div class="hero">
      <div id="view"></div>
      <div class="hero-cap">
        <span id="hero-info"></span>
        <div class="seg small" data-cfg="screen_mode"><button data-v="origin">SteelSeries</button><button data-v="custom">NovaPanel</button></div>
        <button class="ghost" id="hero-black"></button>
      </div>
    </div>

    <div class="stage-bottom">
      <div class="seg big-seg" data-set="anc">
        <button data-v="0"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M6 18L18 6"/></svg><span data-i18n="anc_off"></span></button>
        <button data-v="1"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.5"/><path d="M7.5 7.5a6.4 6.4 0 0 0 0 9M16.5 7.5a6.4 6.4 0 0 1 0 9M4.6 4.6a10.5 10.5 0 0 0 0 14.8M19.4 4.6a10.5 10.5 0 0 1 0 14.8"/></svg><span data-i18n="anc_transp"></span></button>
        <button data-v="2"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4" class="fill"/></svg><span data-i18n="anc_nc"></span></button>
      </div>
    </div>
  </section>

  <aside id="panel">
    <nav id="tabs">
      <button data-tab="audio" class="active" title="Audio"><svg viewBox="0 0 24 24"><path d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect x="3" y="14" width="4" height="6" rx="1.5"/><rect x="17" y="14" width="4" height="6" rx="1.5"/></svg><span>Audio</span></button>
      <button data-tab="eq" data-i18n-title="eq"><svg viewBox="0 0 24 24"><path d="M5 20v-6M5 10V4M12 20v-9M12 7V4M19 20v-4M19 12V4M3 14h4M10 7h4M17 16h4"/></svg><span data-i18n="eq"></span></button>
      <button data-tab="screen" data-i18n-title="screen"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="11" rx="2"/><path d="M8 20h8M12 16v4"/></svg><span data-i18n="screen"></span></button>
      <button data-tab="base" title="Base"><svg viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="10" rx="2.5"/><circle cx="16" cy="13" r="2.5"/><path d="M6.5 11.5h5v3h-5z"/></svg><span>Base</span></button>
      <button data-tab="auto" data-i18n-title="auto"><svg viewBox="0 0 24 24"><path d="M13 3L4 14h7l-1 7 9-11h-7z"/></svg><span>Auto</span></button>
      <button data-tab="settings" data-i18n-title="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span data-i18n="settings"></span></button>
    </nav>

    <div id="pages">
      <!-- AUDIO -->
      <div class="page active" data-page="audio">
        <h2>Audio</h2>
        <div class="card">
          <div class="row"><label data-i18n="transp_level"></label><output data-out="transparency"></output></div>
          <input type="range" min="1" max="10" data-set="transparency">
          <p class="note" id="transp-note"></p>
        </div>
        <div class="card">
          <div class="row"><label data-i18n="sidetone"></label></div>
          <div class="seg" data-set="sidetone"><button data-v="0">Off</button><button data-v="1" data-i18n="low"></button><button data-v="2" data-i18n="medium"></button><button data-v="3" data-i18n="high"></button></div>
          <p class="note" data-i18n="sidetone_note"></p>
        </div>
        <div class="card">
          <div class="row"><label data-i18n="mic_volume"></label><output data-out="mic_volume"></output></div>
          <input type="range" min="1" max="10" data-set="mic_volume">
          <div class="row"><label data-i18n="mic_led"></label><output data-out="mic_led"></output></div>
          <input type="range" min="1" max="10" data-set="mic_led">
        </div>
        <div class="card">
          <div class="row"><label>Gain</label>
            <div class="seg small" data-set="gain"><button data-v="1" data-i18n="low"></button><button data-v="2" data-i18n="gain_high"></button></div></div>
          <div class="row"><label data-i18n="auto_off"></label>
            <select data-set="auto_off"><option value="0" data-i18n="never"></option><option value="1">1 min</option><option value="2">5 min</option><option value="3">10 min</option><option value="4">15 min</option><option value="5">30 min</option><option value="6">60 min</option></select></div>
        </div>
      </div>

      <!-- EGALISEUR -->
      <div class="page" data-page="eq">
        <h2 data-i18n="eq"></h2>
        <div class="card eq-card">
          <svg id="eq" viewBox="0 0 400 230"></svg>
          <div class="row"><span class="note" id="eq-hint" data-i18n="eq_hint"></span>
            <button class="ghost" id="eq-flat" data-i18n="eq_flat"></button></div>
        </div>
        <div class="card">
          <label data-i18n="eq_base"></label>
          <div class="chips" id="eq-base"></div>
          <label data-i18n="eq_mine"></label>
          <div class="chips" id="eq-user"></div>
          <div class="row gap"><input type="text" id="eq-name" data-i18n-placeholder="eq_name"><button class="primary" id="eq-save" data-i18n="save"></button></div>
        </div>
      </div>

      <!-- ECRAN -->
      <div class="page" data-page="screen">
        <h2 data-i18n="screen_title"></h2>
        <div class="card">
          <label data-i18n="display"></label>
          <div class="seg" data-cfg="screen_mode"><button data-v="origin">SteelSeries</button><button data-v="custom">NovaPanel</button></div>
          <div id="page-pick">
            <label>Page</label>
            <div class="seg" data-cfg="screen_page"><button data-v="clock" data-i18n="page_clock"></button><button data-v="music" id="page-music" data-i18n="page_music"></button><button data-v="pc">PC</button><button data-v="rotate" data-i18n="page_rotate"></button></div>
          </div>
        </div>
        <div class="card">
          <label data-i18n="on_screen"></label>
          <div class="toggle-row"><span data-i18n="toggle_mic"></span><input type="checkbox" class="toggle" data-cfg="oled_mic_muted"></div>
          <div class="toggle-row"><span data-i18n="toggle_anc"></span><input type="checkbox" class="toggle" data-cfg="oled_toast_anc"></div>
          <div class="toggle-row"><span data-i18n="toggle_volume"></span><input type="checkbox" class="toggle" data-cfg="oled_toast_volume"></div>
        </div>
        <div class="card">
          <label data-i18n="black"></label>
          <div class="row"><span data-i18n="idle_after"></span><output id="idle-out"></output></div>
          <input type="range" min="0" max="60" step="1" data-cfg="idle_minutes">
          <div class="toggle-row"><span data-i18n="lock"></span><input type="checkbox" class="toggle" data-cfg="black_on_lock"></div>
          <div class="toggle-row"><span data-i18n="sleep"></span><input type="checkbox" class="toggle" data-cfg="black_on_sleep"></div>
          <div class="toggle-row"><span data-i18n="shutdown"></span><input type="checkbox" class="toggle" data-cfg="black_on_shutdown"></div>
          <button class="wide" id="force-black"></button>
        </div>
        <div class="card">
          <div class="row"><label data-i18n="brightness"></label><output data-out="oled_brightness"></output></div>
          <input type="range" min="1" max="10" data-set="oled_brightness">
          <div class="row"><label data-i18n="dim_after"></label>
            <select data-set="oled_dim_timer"><option value="0" data-i18n="never"></option><option value="1">1 min</option><option value="2">5 min</option><option value="3">10 min</option><option value="4">15 min</option><option value="5">30 min</option><option value="6">60 min</option></select></div>
          <div class="row"><label data-i18n="home"></label>
            <div class="seg small" data-set="home_screen"><button data-v="0" data-i18n="detailed"></button><button data-v="1">Simple</button></div></div>
        </div>
      </div>

      <!-- BASE -->
      <div class="page" data-page="base">
        <h2>Base</h2>
        <div class="card">
          <div class="row"><label data-i18n="line_out"></label>
            <div class="seg small" data-set="line_out"><button data-v="1" data-i18n="speakers"></button><button data-v="2">Stream</button></div></div>
          <div class="row"><label data-i18n="wireless"></label>
            <div class="seg small" data-set="wireless_mode"><button data-v="0" data-i18n="latency"></button><button data-v="1" data-i18n="range"></button></div></div>
        </div>
        <div class="card">
          <label>Bluetooth</label>
          <div class="row"><span data-i18n="bt_power"></span>
            <div class="seg small" data-set="bt_power"><button data-v="0" data-i18n="no"></button><button data-v="1" data-i18n="yes"></button></div></div>
          <div class="row"><span data-i18n="bt_call"></span>
            <select data-set="bt_call"><option value="0" data-i18n="call_nothing"></option><option value="1" data-i18n="call_lower"></option><option value="2" data-i18n="call_mute"></option></select></div>
          <div class="row"><span data-i18n="phone"></span><span id="bt-status" class="muted">—</span></div>
        </div>
      </div>

      <!-- AUTOMATISATIONS -->
      <div class="page" data-page="auto">
        <h2 data-i18n="auto"></h2>
        <div class="card">
          <label data-i18n="rules_title"></label>
          <div id="rules"></div>
          <div class="row gap"><select id="rule-app"></select><select id="rule-eq"></select><button class="primary" id="rule-add" data-i18n="add"></button></div>
          <p class="note" data-i18n="rules_note"></p>
        </div>
        <div class="card" id="hk-card">
          <label data-i18n="hotkeys"></label>
          <div class="row"><span data-i18n="hk_anc"></span><input class="hotkey" data-hk="anc_cycle" readonly></div>
          <div class="row"><span data-i18n="hk_black"></span><input class="hotkey" data-hk="screen_black" readonly></div>
          <div class="row"><span data-i18n="hk_page"></span><input class="hotkey" data-hk="screen_page" readonly></div>
          <p class="note" data-i18n="hk_note"></p>
        </div>
        <div class="card">
          <label data-i18n="osd_title"></label>
          <div class="toggle-row"><span data-i18n="osd_main"></span><input type="checkbox" class="toggle" data-cfg="osd"></div>
          <div class="toggle-row"><span data-i18n="osd_mic"></span><input type="checkbox" class="toggle" data-cfg="osd_mic"></div>
        </div>
      </div>

      <!-- REGLAGES -->
      <div class="page" data-page="settings">
        <h2 data-i18n="settings"></h2>
        <div class="card">
          <div class="toggle-row"><span data-i18n="autostart"></span><input type="checkbox" class="toggle" id="autostart"></div>
          <div class="toggle-row"><span data-i18n="check_updates"></span><input type="checkbox" class="toggle" data-cfg="check_updates"></div>
          <div class="row"><span data-i18n="low_battery"></span>
            <select data-cfg="low_battery_level"><option value="0" data-i18n="disabled"></option><option value="1">13 %</option><option value="2">25 %</option><option value="3">38 %</option><option value="4">50 %</option></select></div>
          <div class="toggle-row"><span data-i18n="spare_full"></span><input type="checkbox" class="toggle" data-cfg="notify_spare_full"></div>
          <div class="row"><span data-i18n="language"></span>
            <select id="language"><option value="auto">Auto</option><option value="en">English</option><option value="fr">Français</option></select></div>
        </div>
        <div class="card" id="gg-card">
          <label>SteelSeries GG</label>
          <p class="note" id="gg-status">—</p>
          <button class="wide" id="gg-toggle">—</button>
        </div>
      </div>
    </div>
  </aside>
</main>
<div id="about" hidden>
  <div class="about-box" role="dialog" aria-modal="true" aria-labelledby="about-title">
    <button class="about-x" id="about-close" data-i18n-title="close_about"><svg viewBox="0 0 12 12"><path d="M3 3l6 6M9 3l-6 6"/></svg></button>
    <img src="../assets/icon.png" alt="">
    <h3 id="about-title">NovaPanel <span class="muted" id="version"></span></h3>
    <p class="muted" data-i18n="tagline"></p>
    <a id="update" class="update" hidden></a>
    <p data-i18n="made_by"></p>
    <div class="about-links">
      <a href="https://github.com/sponsors/thibautgnt" class="sponsor" data-i18n="sponsor"></a>
      <a href="https://github.com/thibautgnt/NovaPanel">GitHub</a>
      <a href="https://github.com/thibautgnt/NovaPanel/issues/new/choose" data-i18n="report_bug"></a>
    </div>
    <p class="note" data-i18n="credits"></p>
    <p class="note" id="fw"></p>
    <p class="note" data-i18n="license_note"></p>
  </div>
</div>
<div id="toast"></div>
<script type="module" src="main.js"></script>
</body>
</html>
