name: Bug report / Signaler un bug
description: Something does not work / Quelque chose ne marche pas
body:
  - type: textarea
    id: what
    attributes:
      label: What happened? / Que se passe-t-il ?
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and version / Système et version
      placeholder: Windows 11 24H2, macOS 15, Ubuntu 24.04…
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Base model and firmware / Modèle de la base et firmware
      placeholder: Arctis Nova Pro Wireless (PC), firmware shown in Settings
  - type: textarea
    id: log
    attributes:
      label: Log (run with --debug) / Journal (lancer avec --debug)
      render: text
