name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install .[dev]
      - run: python -m pytest -q
      - run: python packaging/build.py
      - name: Installer
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          $version = python -c "import novapanel; print(novapanel.__version__)"
          & $iscc "/DVersion=$version" packaging\windows\novapanel.iss
          Compress-Archive -Path dist/NovaPanel -DestinationPath dist/NovaPanel-Windows-portable.zip
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/NovaPanel-Setup.exe
            dist/NovaPanel-Windows-portable.zip
      - uses: actions/upload-artifact@v5
        with:
          name: windows
          path: |
            dist/NovaPanel-Setup.exe
            dist/NovaPanel-Windows-portable.zip
      - uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/NovaPanel-Setup.exe
            dist/NovaPanel-Windows-portable.zip
          generate_release_notes: true

  macos:
    runs-on: macos-latest
    env:
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install .[dev]
      - run: python -m pytest -q
      - run: python packaging/build.py
      - run: brew install create-dmg
      - name: Signing certificate
        if: env.MACOS_CERT_P12 != ''
        env:
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          KC=$RUNNER_TEMP/sign.keychain-db
          security create-keychain -p ci "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p ci "$KC"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          xcrun notarytool store-credentials novapanel --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --keychain "$KC"
          ID=$(security find-identity -v -p codesigning "$KC" | grep "Developer ID Application" | head -1 | sed 's/.*"\(.*\)"/\1/')
          echo "MACOS_SIGN_IDENTITY=$ID" >> "$GITHUB_ENV"
          echo "MACOS_NOTARY_PROFILE=novapanel" >> "$GITHUB_ENV"
          echo "NOTARY_KEYCHAIN=$KC" >> "$GITHUB_ENV"
      - run: packaging/macos/make_dmg.sh
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/NovaPanel.dmg
      - uses: actions/upload-artifact@v5
        with:
          name: macos
          path: dist/NovaPanel.dmg
      - uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/NovaPanel.dmg
          generate_release_notes: true

  checksums:
    needs: [windows, macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" -D assets --skip-existing -p 'NovaPanel*'
          cd assets && sha256sum NovaPanel* > SHA256SUMS.txt && cat SHA256SUMS.txt
          gh release upload "$GITHUB_REF_NAME" SHA256SUMS.txt -R "$GITHUB_REPOSITORY" --clobber
